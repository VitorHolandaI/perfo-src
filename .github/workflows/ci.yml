name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy (warnings sao erro)
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - name: Testes
        run: cargo test --all-features --locked
      - name: Validate plugin manifest
        run: |
          jq -e '.schemaVersion == 1 and .id == "vitor.perfo" and .entryPoints.barWidget == "BarWidget.qml"' manifest.json
          test -f BarWidget.qml
          test -f Panel.qml
      - name: QML syntax
        run: |
          # Lint against the Qt that Omarchy actually ships, not the one the
          # runner image happens to carry. Omarchy is Arch, so an Arch
          # container is the Qt its users run: quickshell 0.3.2 links
          # libQt6Core.so.6.12.0, while ubuntu-latest carried 6.10.2. Linting
          # on the older parser masks whatever the newer one rejects.
          #
          # This follows Arch rolling on purpose. A Qt bump that would break
          # the plugin fails here instead of in the field; the cost is that CI
          # can change without a commit.
          #
          # quickshell itself is deliberately NOT installed. Measured on a
          # machine that has it: qmllint reports no import diagnostics either
          # way, even with --import forced to warning, so pulling it from the
          # Omarchy package repository would mean trusting a third-party
          # signing key in CI for no detection gain.
          #
          # The script goes in on stdin through a quoted heredoc rather than
          # inside `bash -c '...'`: an apostrophe in a comment closed that
          # quoted string and broke the whole step, which is a trap worth
          # designing out rather than escaping around.
          docker run --rm -i -v "$PWD:/src:ro" -w /src archlinux:base \
            bash -euo pipefail -s <<'QMLLINT'
          # -Syu rather than -Sy: a partial upgrade installs the new Qt
          # against the older openssl in the image, and qmllint then dies on a
          # missing libcrypto.so.4 before it reads a single file.
          pacman -Syu --noconfirm --needed qt6-declarative >/dev/null
          qmllint_bin=/usr/lib/qt6/bin/qmllint
          test -x "$qmllint_bin"
          "$qmllint_bin" --version

          # This step checks that the QML parses. The semantic categories are
          # turned off because the Quickshell qs.* modules are absent, so type
          # and property resolution fails on every line of a file that is
          # valid on the target.
          #
          # Which categories exist moves between Qt releases: 6.10 dropped
          # --type and --property, 6.12 has not brought them back, and the
          # runner image picked that up silently, failing this step with
          # "Unknown options: type, property". So ask the binary.
          help_text="$("$qmllint_bin" --help-all 2>&1 || true)"
          flags=()
          for category in import type property unqualified; do
            if printf '%s' "$help_text" | grep -q -- "--$category "; then
              flags+=("--$category" disable)
            fi
          done
          echo "qmllint categories disabled: ${flags[*]:-none available}"
          "$qmllint_bin" "${flags[@]}" \
            BarWidget.qml Panel.qml ProcessGrid.qml GpuPage.qml HistoryPage.qml
          QMLLINT
