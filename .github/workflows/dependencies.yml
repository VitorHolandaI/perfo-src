name: Dependency inventory

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: dependencies-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-security:
    name: Cargo inventory and security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # stable
        with:
          toolchain: 1.98.0

      - name: Cache Cargo metadata
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Dependency inventory
        shell: bash
        run: |
          {
            echo "## Direct dependency tree"
            echo '```text'
            cargo tree --locked --depth 1
            echo '```'
            echo "## Duplicate dependency versions"
            echo '```text'
            cargo tree --locked --duplicates
            echo '```'
            echo "## Resolved package count"
            cargo metadata --format-version 1 --locked | jq '.packages | length'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  dependency-review:
    name: Review dependency changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Dependency Review
        uses: actions/dependency-review-action@9538e6e31ca885c263da1e3620f624d7df373284 # v4
